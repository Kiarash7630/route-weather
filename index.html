<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#14232e; --muted:#5d6f7a; --paper:#f2f5f4; --surface:#ffffff; --line:#d5dddb;
  --accent:#0e6b7c; --accent-ink:#ffffff; --glass:rgba(255,255,255,.82);
  --s0:#2f9e6e; --s1:#e0a526; --s2:#e2702b; --s3:#d23b3b;
  --font:"Vazirmatn","Vazir","IRANSansX","Geeza Pro","Damascus","Tahoma",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e7eeee; --muted:#9fb0b8; --paper:#0f1a21; --surface:#172630; --line:#2b3d48;
    --accent:#3ab0c4; --accent-ink:#08222a; --glass:rgba(23,38,48,.82);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;overflow:hidden}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[data-s="0"]{--c:var(--s0)} [data-s="1"]{--c:var(--s1)} [data-s="2"]{--c:var(--s2)} [data-s="3"]{--c:var(--s3)}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}

/* ---------- form ---------- */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px}
.title{font-size:17px;font-weight:700;margin:0 0 8px}
.saved{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px}
.saved[hidden]{display:none}
.sv{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.sv button{border:0;background:none;padding:3px 12px;font-size:13px;cursor:pointer}
.sv .x{padding:3px 10px 3px 4px;color:var(--muted)}
.field{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.dot.o{border:3px solid var(--accent)}
.dot.d{background:var(--ink)}
.field input,.depart input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--paper)}
.ib{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;cursor:pointer}
.depart{display:flex;gap:6px;align-items:center;margin:2px 0 8px}
.depart label{flex:none;font-size:13px;color:var(--muted)}
.depart input{height:40px;font-size:15px}
.btn{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.6;cursor:progress}
.actions{display:flex;gap:6px}
.actions .primary{flex:1}
.status{font-size:13px;color:var(--muted);margin:6px 2px 0}
.status:empty{display:none}
.status.err{color:var(--s3);font-weight:600}

.bar{display:none;width:100%;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:start;cursor:pointer;font-size:15px}
.bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span{flex:none;font-size:13px;color:var(--accent)}
.top.collapsed .title,.top.collapsed #form,.top.collapsed .saved{display:none}
.top.collapsed .bar{display:flex}

/* ---------- map ---------- */
.mapwrap{position:relative;flex:1 1 auto;min-height:200px}
#map{position:absolute;inset:0;direction:ltr;background:#dfe7e5}
#map.picking{cursor:crosshair}
.mapbtns{position:absolute;z-index:500;top:10px;right:10px;display:flex;gap:6px}
.mapbtns button{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hint{position:absolute;z-index:500;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;max-width:92%;direction:rtl}
.hint button{border:0;border-radius:999px;background:var(--paper);color:var(--ink);height:30px;padding:0 12px;cursor:pointer}
.hint[hidden]{display:none}
.mk{width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff}
.mk.active{transform:scale(1.25)}
.pin{position:relative;width:60px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:12px;font-weight:700;border:3px solid #0e6b7c;background:#fff;color:#14232e;box-shadow:0 1px 4px rgba(0,0,0,.35);direction:rtl}
.pin::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#0e6b7c;border-bottom:0}
.pin.d{background:#14232e;color:#fff;border-color:#14232e}
.pin.d::after{border-top-color:#14232e}
.pop{direction:rtl;font-family:var(--font);font-size:13.5px;line-height:1.8;min-width:170px;color:#14232e}
.leaflet-popup-content{margin:10px 12px}
.leaflet-container{font-family:var(--font)}

.timebar{position:absolute;z-index:500;left:10px;right:10px;bottom:26px;display:flex;align-items:center;gap:8px;direction:ltr;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.timebar>button{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.tmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.tlabel{border:0;background:none;font-size:14px;font-weight:700;cursor:pointer;direction:rtl;padding:0 6px;line-height:1.4}
.tmid input{width:100%;margin:2px 0 0;accent-color:var(--accent)}

/* ---------- results sheet ---------- */
.sheet{flex:none;max-height:54vh;max-height:54dvh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;margin-top:-14px;position:relative;z-index:600;padding:4px 14px calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheet.min{max-height:176px;overflow:hidden}
.sheet.min > *:not(.handle):not(.meta):not(.verdict){display:none}
.handle{display:flex;justify-content:center;align-items:center;width:100%;height:26px;border:0;background:none;cursor:pointer;padding:0}
.handle i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);margin-bottom:8px}
.meta b{color:var(--ink)}
.routes{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding:2px 2px 4px}
.rc{flex:1 0 auto;min-width:138px;text-align:start;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:12px;background:var(--paper);padding:6px 10px;cursor:pointer;font-size:13px;line-height:1.55}
.rc.sel{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.rc b{display:block;font-size:14px}
.rc small{display:block;color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px;margin-inline-start:6px}
.verdict{border-inline-start:6px solid var(--c);padding:2px 12px;margin-bottom:8px}
.verdict strong{display:block;font-size:17px}
.verdict span{font-size:13.5px;color:var(--muted)}
.rec{border-inline-start:6px solid var(--c);background:var(--paper);border-radius:10px;padding:6px 12px;margin:0 0 10px;font-size:14px}
.rec strong{display:block}
.groups{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.groups li button{width:100%;text-align:start;display:flex;gap:10px;align-items:center;border:0;border-radius:10px;background:var(--paper);padding:8px 10px;border-inline-start:6px solid var(--c);cursor:pointer;font-size:14px}
.groups .gi{font-size:20px}
.groups small{display:block;color:var(--muted);font-size:12.5px}

.strip{display:flex;gap:2px;height:22px;margin:4px 0 4px}
.seg{flex:1;border:0;padding:0;background:var(--c);border-radius:4px;cursor:pointer;min-width:4px}
.seg.active{outline:3px solid var(--ink);outline-offset:1px}
.stripends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:5px}

.mode{display:flex;gap:6px;align-items:center;margin:0 0 6px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note a{color:var(--accent)}
.best{background:var(--paper);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.best strong{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px 12px;font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.warn{font-size:13.5px;border-radius:10px;background:var(--paper);border-inline-start:6px solid var(--s2);padding:6px 12px;margin:0 0 12px}

.actions2{display:flex;gap:8px;margin-bottom:8px}
.actions2 a{flex:1;display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
.actions2 .btn{flex:1;font-size:13.5px;padding:0 6px}
.actions2 a.alt.wide{flex:1}
.actions2 a.alt{flex:0 0 auto;padding:0 14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:0 0 12px}

.pts{list-style:none;margin:0;padding:0}
.pt{width:100%;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ico top temp" "ico bot nums";column-gap:10px;align-items:center;text-align:start;border:0;background:none;padding:8px 10px;border-top:1px solid var(--line);border-inline-start:5px solid var(--c);cursor:pointer;font-size:14px}
.pt.active{background:var(--paper)}
.pt .ico{grid-area:ico;font-size:24px}
.pt .top1{grid-area:top}
.pt .top1 span{color:var(--muted);font-size:13px;margin-inline-start:8px}
.pt .temp{grid-area:temp;font-weight:700}
.pt .bot{grid-area:bot;font-size:13.5px}
.pt .nums{grid-area:nums;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:flex-end}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;margin-inline-start:6px;background:var(--c);color:#14232e}
.foot{font-size:12px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <button type="button" class="bar" id="bar" aria-label="ویرایش مسیر"><b id="barText"></b><span>ویرایش</span></button>
    <h1 class="title">هوای مسیر</h1>
    <div class="saved" id="saved" hidden></div>
    <form id="form" autocomplete="off">
      <div class="field">
        <span class="dot o" aria-hidden="true"></span>
        <input id="origin" list="cities" placeholder="مبدا، مثلاً تهران" aria-label="مبدا" enterkeyhint="next">
        <button type="button" class="ib" id="locBtn" aria-label="استفاده از موقعیت من">📍</button>
        <button type="button" class="ib" data-pick="o" aria-label="انتخاب مبدا روی نقشه">🎯</button>
      </div>
      <div class="field">
        <span class="dot d" aria-hidden="true"></span>
        <input id="dest" list="cities" placeholder="مقصد، مثلاً مشهد" aria-label="مقصد" enterkeyhint="go">
        <button type="button" class="ib" data-pick="d" aria-label="انتخاب مقصد روی نقشه">🎯</button>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="swap" aria-label="جابه‌جایی مبدا و مقصد">⇅ جابه‌جایی</button>
        <button type="button" class="btn" id="clearBtn">پاک‌کردن</button>
        <button type="submit" class="btn primary" id="go">بررسی هوای مسیر</button>
      </div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <datalist id="cities"></datalist>
  </header>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="نقشه‌ی مسیر"></div>
    <div class="mapbtns">
      <button type="button" id="pickO">📍 انتخاب مبدا</button>
      <button type="button" id="pickD">🏁 انتخاب مقصد</button>
    </div>
    <div class="hint" id="hint" hidden><span id="hintText"></span><button type="button" id="hintCancel">لغو</button></div>
    <div class="timebar" id="timebar">
      <button type="button" id="tMinus" aria-label="یک ساعت زودتر">−</button>
      <div class="tmid">
        <button type="button" id="tLabel" class="tlabel" aria-label="بازگشت به اکنون">اکنون</button>
        <input type="range" id="tRange" min="0" max="143" step="1" value="0" aria-label="زمان حرکت">
      </div>
      <button type="button" id="tPlus" aria-label="یک ساعت دیرتر">+</button>
    </div>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="نتیجه‌ی بررسی مسیر"></section>
</div>

      if (i === ri) return;
      var alt = L.polyline(r.latlngs, { color: '#6b7c86', weight: 5, opacity: 0.7, dashArray: '2 9', lineCap: 'round' }).addTo(routeLayer);
      alt.on('click', function () { if (!pickTarget) showRoute(i, false); });
    });
    var all = data.routes[ri].latlngs, pts = ev.pts;
    var line = L.polyline(all, { color: '#ffffff', weight: 10, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    for (var k = 0; k < pts.length - 1; k++) {
      var a = pts[k], b = pts[k + 1];
      var seg = [[a.lat, a.lon]];
      for (var q = a.j; q < b.j; q++) seg.push(all[q]);
      seg.push([b.lat, b.lon]);
      L.polyline(seg, { color: SEV_COLOR[Math.max(a.a.s, b.a.s)], weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    }
    pts.forEach(function (p, i) {
      var icon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="mk" data-s="' + p.a.s + '" id="mk' + i + '">' + p.icon + '</div>' });
      var m = L.marker([p.lat, p.lon], { icon: icon, keyboard: false }).addTo(routeLayer);
      m.bindPopup(popupHTML(p, data.dep));
      m.on('click', function () { setActive(i); });
      markers.push(m);
    });
    if (fit) {
      requestAnimationFrame(function () {
        map.invalidateSize();
        map.fitBounds(line.getBounds(), { padding: [30, 30] });
      });
    }
  }

  function routeReason(rec) {
    var R = data.routes, b = rec.best, f = rec.fastest, evs = rec.evs;
    if (R.length < 2) return '';
    if (b === f) {
      if (evs[b].worst === 0) return 'همه‌ی مسیرها از نظر هوا مناسب‌اند؛ سریع‌ترین مسیر پیشنهاد می‌شود.';
      return 'سریع‌ترین مسیر از نظر هوا هم بهترین است (یا تفاوت قابل‌توجهی بین مسیرها نیست).';
    }
    var extra = R[b].dur - R[f].dur;
    var why = evs[b].worst < evs[f].worst
      ? 'بدترین وضعیت آن «' + SEV_LABEL[evs[b].worst] + '» است، به جای «' + SEV_LABEL[evs[f].worst] + '» در مسیر ' + fa(f + 1)
      : 'کیلومتر کمتری با بارش یا شرایط نامساعد دارد';
    return 'مسیر ' + fa(b + 1) + ' با ' + fmtDur(extra) + ' زمان بیشتر پیشنهاد می‌شود؛ ' + why + '.';
  }

  function bestTimeHTML(ri, ev) {
    var dep = data.dep, scan = scanTimes(ri, dep), cur = scan[0];
    var rest = scan.slice(1).sort(function (a, b) { return a.exposure - b.exposure || a.ms - b.ms; });
    var best = rest[0], html = '<div class="best"><strong>بهترین ساعت حرکت</strong>';
    if (cur.exposure === 0) {
      html += '<span>ساعت حرکت فعلی از نظر هوا مناسب است.</span>';
    } else if (best && cur.exposure - best.exposure >= 3 && best.exposure <= cur.exposure * 0.7) {
      html += '<span>اگر حدود ساعت ' + whenText(best.ms, dep) + ' حرکت کنید، هوای مسیر بهتر است (بدترین وضعیت: «' +
        SEV_LABEL[best.worst] + '» به جای «' + SEV_LABEL[cur.worst] + '»).</span><div class="chips">';
      rest.slice(0, 3).forEach(function (c) {
        if (c.exposure < cur.exposure) {
          html += '<button type="button" class="chip" data-dep="' + c.ms + '" data-s="' + c.worst + '"><i></i>' + whenText(c.ms, dep) + '</button>';
        }
      });
      html += '</div>';
    } else {
      html += '<span>در ۲۴ ساعت آینده ساعت به‌مراتب بهتری دیده نمی‌شود.</span>';
    }
    return html + '</div>';
  }

  function renderSheet(ev, ri, rec) {
    var R = data.routes, r = R[ri], pts = ev.pts, dep = data.dep, worst = ev.worst;
    var arr = dep + r.dur * 1000, groups = groupsOf(pts), maxElev = 0;
    pts.forEach(function (p) { if (p.elev > maxElev) maxElev = p.elev; });
    var html = '<button type="button" class="handle" data-act="handle" aria-label="کوچک یا بزرگ کردن پنل"><i></i></button>';

    if (R.length > 1) {
      html += '<div class="routes">';
      R.forEach(function (rr, i) {
        html += '<button type="button" class="rc' + (i === ri ? ' sel' : '') + '" data-r="' + i + '" data-s="' + rec.evs[i].worst + '" aria-pressed="' + (i === ri) + '">' +
          '<b>مسیر ' + fa(i + 1) + (i === rec.best ? '<span class="badge">پیشنهادی</span>' : '') + '</b>' +
          '<small>' + fa(Math.round(rr.total)) + ' کیلومتر · ' + fmtDur(rr.dur) + '</small>' +
          '<small>' + SEV_LABEL[rec.evs[i].worst] + '</small></button>';
      });
      html += '</div>';
    }

    html += '<div class="meta"><span><b>' + fa(Math.round(r.total)) + '</b> کیلومتر</span><span><b>' + fmtDur(r.dur) +
      '</b></span><span>رسیدن حدود <b>' + whenText(arr, dep) + '</b></span>' +
      (maxElev ? '<span>بلندترین نقطه <b>' + fa(Math.round(maxElev)) + '</b> متر</span>' : '') +
      '<span>به‌روزرسانی ' + fmtTime(data.fetchedAt) + '</span></div>';

    var vt, vs;
    if (worst === 0) { vt = 'مسیر بدون بارش و شرایط خطرناک'; vs = 'طبق پیش‌بینی، در طول مسیر مشکل مهمی دیده نمی‌شود.'; }
    else { vt = SEV_LABEL[worst] + ' در مسیر'; vs = fa(groups.length) + ' بخش از مسیر هوای نامطلوب دارد.'; }
    html += '<div class="verdict" data-s="' + worst + '"><strong>' + vt + '</strong><span>' + vs + '</span></div>';

    if (R.length > 1) {
      html += '<div class="rec" data-s="' + rec.evs[rec.best].worst + '"><strong>پیشنهاد مسیر</strong>' + routeReason(rec) + '</div>';
    }

    if (groups.length) {
      html += '<ul class="groups">';
      groups.forEach(function (g) {
        var from = pts[g.from], to = pts[g.to], w = g.worst;
        var range = g.from === g.to ? 'حدود کیلومتر ' + fa(Math.round(from.km)) :
          'کیلومتر ' + fa(Math.round(from.km)) + ' تا ' + fa(Math.round(to.km));
        html += '<li><button type="button" data-i="' + g.wi + '" data-s="' + w.a.s + '"><span class="gi">' + w.icon + '</span><span><b>' +
          w.desc + '</b>' + (w.a.tags.length ? ' · ' + w.a.tags.join('، ') : '') + '<small>' + range + ' · حدود ساعت ' + whenText(w.eta, dep) + '</small></span></button></li>';
      });
      html += '</ul>';
    }

    var cold = pts.some(function (p) { return p.elev > 1500 && (p.w.temp <= 3 || p.w.snow > 0); });
    if (cold) html += '<p class="warn">در بخش‌هایی از مسیر (ارتفاع بالای ۱۵۰۰ متر) دما نزدیک صفر است؛ احتمال برف یا یخ‌زدگی جاده هست و بهتر است زنجیرچرخ همراه داشته باشید.</p>';
    if (ev.beyond) html += '<p class="warn">برای بعضی ساعت‌های مسیر، پیش‌بینی کافی در دسترس نبود و از آخرین داده‌ی موجود استفاده شد.</p>';

    html += '<div class="strip" role="group" aria-label="وضعیت هوا در طول مسیر">';
    for (var s = 0; s < pts.length - 1; s++) {
      var sv = Math.max(pts[s].a.s, pts[s + 1].a.s);
      var idx = pts[s].a.s >= pts[s + 1].a.s ? s : s + 1;
      html += '<button type="button" class="seg" data-s="' + sv + '" data-i="' + idx + '" aria-label="کیلومتر ' + fa(Math.round(pts[s].km)) +
        ' تا ' + fa(Math.round(pts[s + 1].km)) + ': ' + SEV_LABEL[sv] + '"></button>';
    }
    html += '</div><div class="stripends"><span>مبدا · ' + fmtTime(dep) + '</span><span>مقصد · ' + fmtTime(arr) + '</span></div>';
    html += '<div class="legend">';
    for (var l = 0; l < 4; l++) html += '<span data-s="' + l + '"><i></i>' + SEV_LABEL[l] + '</span>';
    html += '</div>';

    html += '<div class="mode"><span>حساسیت بارش:</span>' +
      '<button type="button" class="chip' + (cautious ? ' on' : '') + '" data-mode="cautious">محتاط</button>' +
      '<button type="button" class="chip' + (cautious ? '' : ' on') + '" data-mode="normal">معمولی</button></div>' +
      '<p class="note">محتاط: بیشینه‌ی چند مدل هواشناسی و در نظر گرفتن ±۱ ساعت خطای زمانی. مدل‌ها پیش‌بینی‌اند، نه رادار؛ رگبارهای محلی را همیشه نشان نمی‌دهند.</p>';
    html += bestTimeHTML(ri, ev);

    var sum = data.o.label + ' ← ' + data.d.label + '\n' + fa(Math.round(r.total)) + ' کیلومتر · ' + fmtDur(r.dur) +
      '\nحرکت ' + whenText(dep, dep) + ' · رسیدن حدود ' + whenText(arr, dep) + '\n' + vt;
    groups.slice(0, 3).forEach(function (g) {
      sum += '\n• ' + g.worst.desc + ' (کیلومتر ' + fa(Math.round(pts[g.from].km)) + ' تا ' + fa(Math.round(pts[g.to].km)) + ')';
    });
    lastSummary = sum.replace(/[\u2066\u2069]/g, '');

    var mid = pts[Math.floor(pts.length / 2)];
    var windyUrl = 'https://www.windy.com/?rain,' + mid.lat.toFixed(3) + ',' + mid.lon.toFixed(3) + ',8';
    var wazeUrl = 'https://waze.com/ul?ll=' + data.d.lat.toFixed(6) + ',' + data.d.lon.toFixed(6) + '&navigate=yes';
    var gmUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + data.d.lat.toFixed(6) + ',' + data.d.lon.toFixed(6) + '&travelmode=driving';
    var windyUrl = 'https://www.windy.com/' + data.o.lat.toFixed(3) + '/' + data.o.lon.toFixed(3) + '?radar,' + data.o.lat.toFixed(3) + ',' + data.o.lon.toFixed(3) + ',8';
    html += '<div class="actions2"><a class="alt wide" href="' + windyUrl + '" target="_blank" rel="noopener">رادار و ماهواره (Windy) · باران لحظه‌ای</a></div>';
    html += '<div class="actions2"><a href="' + wazeUrl + '" target="_blank" rel="noopener">باز کردن مقصد در Waze</a>' +
      '<a class="alt" href="' + gmUrl + '" target="_blank" rel="noopener">Google Maps</a></div>' +
      '<div class="actions2"><button type="button" class="btn" data-act="save">⭐ ذخیره</button>' +
      '<button type="button" class="btn" data-act="share">اشتراک‌گذاری</button>' +
      '<button type="button" class="btn" data-act="refresh">به‌روزرسانی</button></div>' +
      '<p class="note">Waze مسیر را از موقعیت فعلی شما شروع می‌کند و ممکن است مسیر دیگری پیشنهاد بدهد. ترافیک و بسته‌بودن جاده را در Waze ببینید.</p>' +
      '<p class="note">بارش لحظه‌ای را روی رادار و ماهواره هم ببینید: <a href="' + windyUrl + '" target="_blank" rel="noopener">Windy</a></p>';

    html += '<ol class="pts">';
    pts.forEach(function (p, i) {
      html += '<li><button type="button" class="pt" data-i="' + i + '" data-s="' + p.a.s + '">' +
        '<span class="ico">' + p.icon + '</span>' +
        '<span class="top1"><b>کیلومتر ' + fa(Math.round(p.km)) + '</b><span>' + whenText(p.eta, dep) + '</span></span>' +
        '<span class="temp">' + deg(p.w.temp) + '</span>' +
        '<span class="bot">' + p.desc + p.a.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</span>' +
        '<span class="nums"><span>' + fa(p.w.precip, 1) + ' میلی‌متر</span><span>' + fa(Math.round(p.w.wind)) + ' km/h</span>' +
        (p.elev != null ? '<span>' + fa(Math.round(p.elev)) + ' متر</span>' : '') + '</span>' +
        '</button></li>';
    });
    html += '</ol>';
    html += '<p class="foot">داده‌ی هوا خروجی مدل‌های جوی با شبکه‌ی چندکیلومتری است، نه مشاهده‌ی لحظه‌ای؛ بارش‌های محلی ممکن است نشان داده نشود و پیش‌بینی با شرایط واقعی تفاوت دارد؛ برای وضعیت جاده‌ها به اعلام راهداری (۱۴۱) هم توجه کنید. زمان رسیدن تخمینی است و ترافیک و توقف‌ها را شامل نمی‌شود. داده‌ها: Open-Meteo (مدل‌های ICON، ECMWF، GFS)، نقشه: OpenStreetMap، مسیریابی: OSRM.</p>';

    sheetEl.innerHTML = html; sheetEl.hidden = false; sheetEl.scrollTop = 0;
  }

  function popupHTML(p, dep) {
    return '<div class="pop"><b>کیلومتر ' + fa(Math.round(p.km)) + '</b> · ساعت ' + whenText(p.eta, dep) + '<br>' +
      p.icon + ' ' + p.desc + (p.a.tags.length ? ' · ' + p.a.tags.join('، ') : '') + '<br>' +
      'دما ' + deg(p.w.temp) + ' · بارش ' + fa(p.w.precip, 1) + ' میلی‌متر<br>باد ' + fa(Math.round(p.w.wind)) +
      ' km/h (تندباد ' + fa(Math.round(p.w.gust)) + ')' +
      (p.elev != null ? '<br>ارتفاع ' + fa(Math.round(p.elev)) + ' متر' : '') + '</div>';
  }

  function setActive(i) {
    document.querySelectorAll('.pt.active,.seg.active').forEach(function (e) { e.classList.remove('active'); });
    document.querySelectorAll('.mk.active').forEach(function (e) { e.classList.remove('active'); });
    document.querySelectorAll('.pt[data-i="' + i + '"],.seg[data-i="' + i + '"]').forEach(function (e) { e.classList.add('active'); });
    var mk = document.getElementById('mk' + i); if (mk) mk.classList.add('active');
  }
  function focusPoint(i) {
    var m = markers[i]; if (!m) return;
    setActive(i);
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 9), { animate: true });
    m.openPopup();
  }

  sheetEl.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-i],[data-r],[data-dep]');
    if (!el) return;
    var ds = el.dataset;
    if (ds.act === 'handle') { sheetEl.classList.toggle('min'); }
    else if (ds.act === 'save') { saveCurrent(el); }
    else if (ds.act === 'refresh') { run(); }
    else if (ds.act === 'share') { shareSummary(el); }
    else if (ds.mode) {
      cautious = ds.mode === 'cautious';
      try { localStorage.setItem('rw_mode', cautious ? 'cautious' : 'normal'); } catch (e) { /* ignore */ }
      showRoute(data.sel, false);
    }
    else if (ds.dep) {
      setDepMs(+ds.dep); commitDep();
    }
    else if (ds.r != null) { showRoute(+ds.r, false); }
    else if (ds.i != null) { focusPoint(+ds.i); }
  });

  function shareSummary(btn) {
    if (!lastSummary) return;
    if (navigator.share) { navigator.share({ title: 'هوای مسیر', text: lastSummary }).catch(function () { /* cancelled */ }); }
    else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastSummary).then(function () { btn.textContent = 'کپی شد ✓'; });
    }
  }

  var LASTKEY = 'rw_last_v1';
  function saveLast(o, d) {
    try {
      localStorage.setItem(LASTKEY, JSON.stringify({
        o: { label: o.label, lat: o.lat, lon: o.lon, gps: !!o.gps }, d: { label: d.label, lat: d.lat, lon: d.lon }
      }));
    } catch (e) { /* ignore */ }
  }
  function loadLast() {
    try {
      var x = JSON.parse(localStorage.getItem(LASTKEY) || 'null');
      if (!x || !x.d) return;
      if (x.o && !x.o.gps) setPoint(originEl, x.o, x.o.label);
      setPoint(destEl, x.d, x.d.label);
      if (x.o && !x.o.gps) map.fitBounds([[x.o.lat, x.o.lon], [x.d.lat, x.d.lon]], { padding: [60, 60] });
      setStatus('آخرین مسیر شما آماده است؛ «بررسی هوای مسیر» را بزنید.');
    } catch (e) { /* ignore */ }
  }
  function resetAll() {
    endPick(); data = null; routeLayer.clearLayers(); markers = [];
    ['o', 'd'].forEach(function (k) { if (pins[k]) { pinLayer.removeLayer(pins[k]); pins[k] = null; } });
    [originEl, destEl].forEach(function (el) { el.value = ''; delete el.dataset.lat; delete el.dataset.lon; delete el.dataset.gps; });
    sheetEl.hidden = true; sheetEl.innerHTML = '';
    $('#top').classList.remove('collapsed'); setStatus('');
    map.fitBounds([[25.0, 44.0], [39.8, 63.5]]);
  }
  $('#clearBtn').addEventListener('click', resetAll);
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && data && !busy && Date.now() - data.fetchedAt > 30 * 60000) run();
    });
  }

  $('#bar').addEventListener('click', function () { $('#top').classList.remove('collapsed'); });
  $('#form').addEventListener('submit', function (e) { e.preventDefault(); run(); });
  renderSaved();
  loadLast();
})();
</script>
</body>
</html>
