<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#14232e; --muted:#5d6f7a; --paper:#f2f5f4; --surface:#ffffff; --line:#d5dddb;
  --accent:#0e6b7c; --accent-ink:#ffffff;
  --s0:#2f9e6e; --s1:#e0a526; --s2:#e2702b; --s3:#d23b3b;
  --font:"Vazirmatn","Vazir","IRANSansX","Geeza Pro","Damascus","Tahoma",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e7eeee; --muted:#9fb0b8; --paper:#0f1a21; --surface:#172630; --line:#2b3d48;
    --accent:#3ab0c4; --accent-ink:#08222a;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;overflow:hidden}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}

/* ---------- form ---------- */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px}
.title{font-size:17px;font-weight:700;margin:0 0 8px}
.field{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.dot.o{border:3px solid var(--accent)}
.dot.d{background:var(--ink)}
.field input,.depart input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--paper)}
.ib{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;cursor:pointer}
.depart{display:flex;gap:6px;align-items:center;margin:2px 0 8px}
.depart label{flex:none;font-size:13px;color:var(--muted)}
.depart input{height:40px;font-size:15px}
.btn{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.6;cursor:progress}
.actions{display:flex;gap:6px}
.actions .primary{flex:1}
.status{min-height:0;font-size:13px;color:var(--muted);margin:6px 2px 0}
.status:empty{display:none}
.status.err{color:var(--s3);font-weight:600}

.bar{display:none;width:100%;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:start;cursor:pointer;font-size:15px}
.bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span{flex:none;font-size:13px;color:var(--accent)}
.top.collapsed .title,.top.collapsed #form{display:none}
.top.collapsed .bar{display:flex}

/* ---------- map ---------- */
.mapwrap{position:relative;flex:1 1 auto;min-height:200px}
#map{position:absolute;inset:0;direction:ltr;background:#dfe7e5}
#map.picking{cursor:crosshair}
.hint{position:absolute;z-index:500;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;max-width:92%;direction:rtl}
.hint button{border:0;border-radius:999px;background:var(--paper);color:var(--ink);height:30px;padding:0 12px;cursor:pointer}
.hint[hidden]{display:none}
.mk{width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff}
.mk.active{transform:scale(1.25)}
.pop{direction:rtl;font-family:var(--font);font-size:13.5px;line-height:1.8;min-width:170px;color:#14232e}
.leaflet-popup-content{margin:10px 12px}
.leaflet-container{font-family:var(--font)}

/* ---------- results sheet ---------- */
.sheet{flex:none;max-height:52vh;max-height:52dvh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;margin-top:-14px;position:relative;z-index:600;padding:14px 14px calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
[data-s="0"]{--c:var(--s0)} [data-s="1"]{--c:var(--s1)} [data-s="2"]{--c:var(--s2)} [data-s="3"]{--c:var(--s3)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);margin-bottom:8px}
.meta b{color:var(--ink)}
.verdict{border-inline-start:6px solid var(--c);padding:2px 12px;margin-bottom:8px}
.verdict strong{display:block;font-size:17px}
.verdict span{font-size:13.5px;color:var(--muted)}
.groups{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.groups li button{width:100%;text-align:start;display:flex;gap:10px;align-items:center;border:0;border-radius:10px;background:var(--paper);padding:8px 10px;border-inline-start:6px solid var(--c);cursor:pointer;font-size:14px}
.groups .gi{font-size:20px}
.groups small{display:block;color:var(--muted);font-size:12.5px}

.strip{display:flex;gap:2px;height:22px;margin:4px 0 4px}
.seg{flex:1;border:0;padding:0;background:var(--c);border-radius:4px;cursor:pointer;min-width:4px}
.seg.active{outline:3px solid var(--ink);outline-offset:1px}
.stripends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:5px}

.actions2{display:flex;gap:8px;margin-bottom:12px}
.actions2 a{flex:1;display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
.actions2 button{flex:none}
.note{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}

.pts{list-style:none;margin:0;padding:0}
.pt{width:100%;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ico top temp" "ico bot nums";column-gap:10px;align-items:center;text-align:start;border:0;background:none;padding:8px 10px;border-top:1px solid var(--line);border-inline-start:5px solid var(--c);cursor:pointer;font-size:14px}
.pt.active{background:var(--paper)}
.pt .ico{grid-area:ico;font-size:24px}
.pt .top1{grid-area:top}
.pt .top1 span{color:var(--muted);font-size:13px;margin-inline-start:8px}
.pt .temp{grid-area:temp;font-weight:700}
.pt .bot{grid-area:bot;font-size:13.5px}
.pt .nums{grid-area:nums;font-size:12.5px;color:var(--muted);display:flex;gap:10px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;margin-inline-start:6px;background:var(--c);color:#14232e}
.foot{font-size:12px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <button type="button" class="bar" id="bar" aria-label="ویرایش مسیر"><b id="barText"></b><span>ویرایش</span></button>
    <h1 class="title">هوای مسیر</h1>
    <form id="form" autocomplete="off">
      <div class="field">
        <span class="dot o" aria-hidden="true"></span>
        <input id="origin" list="cities" placeholder="مبدا، مثلاً تهران" aria-label="مبدا" enterkeyhint="next">
        <button type="button" class="ib" id="locBtn" aria-label="استفاده از موقعیت من">📍</button>
        <button type="button" class="ib" data-pick="origin" aria-label="انتخاب مبدا روی نقشه">🎯</button>
      </div>
      <div class="field">
        <span class="dot d" aria-hidden="true"></span>
        <input id="dest" list="cities" placeholder="مقصد، مثلاً مشهد" aria-label="مقصد" enterkeyhint="go">
        <button type="button" class="ib" data-pick="dest" aria-label="انتخاب مقصد روی نقشه">🎯</button>
      </div>
      <div class="depart">
        <label for="depart">زمان حرکت</label>
        <input id="depart" type="datetime-local">
        <button type="button" class="btn" id="nowBtn">اکنون</button>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="swap" aria-label="جابه‌جایی مبدا و مقصد">⇅ جابه‌جایی</button>
        <button type="submit" class="btn primary" id="go">بررسی هوای مسیر</button>
      </div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <datalist id="cities"></datalist>
  </header>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="نقشه‌ی مسیر"></div>
    <div class="hint" id="hint" hidden><span id="hintText"></span><button type="button" id="hintCancel">لغو</button></div>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="نتیجه‌ی بررسی مسیر"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var $ = function (s) { return document.querySelector(s); };
  var fa = function (n, d) {
    return Number(n).toLocaleString('fa-IR', { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: 0 });
  };
  var norm = function (s) {
    return String(s).replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ۀ/g, 'ه')
      .replace(/[\u200c\u200e\u200f]/g, ' ').replace(/\s+/g, ' ').trim();
  };
  function UserError(msg) { this.message = msg; this.user = true; }

  var CITIES = {
    'تهران': [35.6892, 51.3890], 'مشهد': [36.2972, 59.6067], 'اصفهان': [32.6546, 51.6680],
    'شیراز': [29.5918, 52.5837], 'تبریز': [38.0962, 46.2738], 'کرج': [35.8400, 50.9391],
    'اهواز': [31.3183, 48.6706], 'قم': [34.6416, 50.8746], 'کرمانشاه': [34.3142, 47.0650],
    'ارومیه': [37.5527, 45.0760], 'رشت': [37.2808, 49.5832], 'زاهدان': [29.4963, 60.8629],
    'کرمان': [30.2839, 57.0834], 'همدان': [34.7989, 48.5150], 'یزد': [31.8974, 54.3569],
    'اردبیل': [38.2498, 48.2933], 'بندرعباس': [27.1865, 56.2808], 'اراک': [34.0954, 49.6892],
    'سنندج': [35.3219, 46.9862], 'قزوین': [36.2797, 50.0049], 'ساری': [36.5633, 53.0601],
    'گرگان': [36.8427, 54.4396], 'بوشهر': [28.9234, 50.8203], 'بجنورد': [37.4747, 57.3290],
    'خرم‌آباد': [33.4878, 48.3558], 'زنجان': [36.6765, 48.4963], 'سمنان': [35.5769, 53.3920],
    'چالوس': [36.6550, 51.4200], 'شهرکرد': [32.3256, 50.8644], 'یاسوج': [30.6682, 51.5880],
    'ایلام': [33.6374, 46.4227], 'بیرجند': [32.8663, 59.2211], 'کیش': [26.5579, 53.9800],
    'آمل': [36.4696, 52.3507], 'بابل': [36.5513, 52.6789],
    'سبزوار': [36.2152, 57.6678], 'نیشابور': [36.2140, 58.7960], 'کاشان': [33.9850, 51.4100],
    'ساوه': [35.0213, 50.3566], 'بروجرد': [33.8973, 48.7516], 'دزفول': [32.3830, 48.4010],
    'ایرانشهر': [27.2025, 60.6848], 'چابهار': [25.2919, 60.6430], 'آبادان': [30.3392, 48.3043]
  };
  var CITY_INDEX = {};
  Object.keys(CITIES).forEach(function (name) {
    CITY_INDEX[norm(name)] = { lat: CITIES[name][0], lon: CITIES[name][1] };
    var o = document.createElement('option'); o.value = name; $('#cities').appendChild(o);
  });

  var WX = {
    0: ['آسمان صاف', '☀️'], 1: ['عمدتاً صاف', '🌤️'], 2: ['نیمه‌ابری', '⛅'], 3: ['ابری', '☁️'],
    45: ['مه', '🌫️'], 48: ['مه یخ‌زده', '🌫️'],
    51: ['نم‌نم باران', '🌦️'], 53: ['نم‌نم باران', '🌦️'], 55: ['نم‌نم باران شدید', '🌦️'],
    56: ['نم‌نم یخ‌زده', '🧊'], 57: ['نم‌نم یخ‌زده', '🧊'],
    61: ['باران ضعیف', '🌧️'], 63: ['باران متوسط', '🌧️'], 65: ['باران شدید', '🌧️'],
    66: ['باران یخ‌زده', '🧊'], 67: ['باران یخ‌زده شدید', '🧊'],
    71: ['برف ضعیف', '🌨️'], 73: ['برف متوسط', '🌨️'], 75: ['برف شدید', '❄️'], 77: ['دانه‌برف', '🌨️'],
    80: ['رگبار ضعیف', '🌦️'], 81: ['رگبار متوسط', '🌧️'], 82: ['رگبار شدید', '⛈️'],
    85: ['رگبار برف', '🌨️'], 86: ['رگبار برف شدید', '❄️'],
    95: ['رعد و برق', '⛈️'], 96: ['رعد و برق با تگرگ', '⛈️'], 99: ['رعد و برق با تگرگ شدید', '⛈️']
  };
  var SEV_COLOR = ['#2f9e6e', '#e0a526', '#e2702b', '#d23b3b'];
  var SEV_LABEL = ['شرایط مناسب', 'بارش یا شرایط ضعیف', 'شرایط نامساعد', 'شرایط خطرناک'];

  var fmtTime = function (ms) {
    return new Date(ms).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', hour12: false });
  };
  var dayKey = function (ms) { return new Date(ms).toLocaleDateString('en-CA'); };
  var fmtDay = function (ms) { return new Date(ms).toLocaleDateString('fa-IR', { weekday: 'long' }); };
  function fmtDur(sec) {
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (m === 60) { h += 1; m = 0; }
    if (h === 0) return fa(m) + ' دقیقه';
    return m ? fa(h) + ' ساعت و ' + fa(m) + ' دقیقه' : fa(h) + ' ساعت';
  }
  function toLocalInput(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function getJSON(url, ms) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, ms || 25000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { clearTimeout(t); return j; }, function (e) { clearTimeout(t); throw e; });
  }

  function getFirst(urls, ms) {
    var i = 0;
    function next(lastErr) {
      if (i >= urls.length) return Promise.reject(lastErr || new Error('failed'));
      return getJSON(urls[i++], ms || 15000).catch(next);
    }
    return next();
  }

  /* ---------- map ---------- */
  var map = L.map('map', { zoomControl: true, attributionControl: true });
  map.fitBounds([[25.0, 44.0], [39.8, 63.5]]);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© OpenStreetMap'
  }).addTo(map);
  var routeLayer = L.layerGroup().addTo(map);
  if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); }).observe($('#map'));

  /* ---------- inputs ---------- */
  var originEl = $('#origin'), destEl = $('#dest'), departEl = $('#depart');
  var departTouched = false;
  departEl.value = toLocalInput(new Date());
  departEl.min = toLocalInput(new Date(Date.now() - 3600 * 1000));
  departEl.max = toLocalInput(new Date(Date.now() + 4 * 86400 * 1000));
  departEl.addEventListener('input', function () { departTouched = true; });
  $('#nowBtn').addEventListener('click', function () { departTouched = false; departEl.value = toLocalInput(new Date()); });

  [originEl, destEl].forEach(function (el) {
    el.addEventListener('input', function () { delete el.dataset.lat; delete el.dataset.lon; });
  });

  function setPoint(el, pt, label) {
    el.value = label; el.dataset.lat = pt.lat; el.dataset.lon = pt.lon;
  }
  function setStatus(msg, isErr) {
    var s = $('#status'); s.textContent = msg || ''; s.classList.toggle('err', !!isErr);
  }

  $('#swap').addEventListener('click', function () {
    var a = { v: originEl.value, la: originEl.dataset.lat, lo: originEl.dataset.lon };
    var b = { v: destEl.value, la: destEl.dataset.lat, lo: destEl.dataset.lon };
    originEl.value = b.v; destEl.value = a.v;
    delete originEl.dataset.lat; delete originEl.dataset.lon; delete destEl.dataset.lat; delete destEl.dataset.lon;
    if (b.la) { originEl.dataset.lat = b.la; originEl.dataset.lon = b.lo; }
    if (a.la) { destEl.dataset.lat = a.la; destEl.dataset.lon = a.lo; }
  });

  $('#locBtn').addEventListener('click', function () {
    if (!navigator.geolocation) { setStatus('این مرورگر موقعیت مکانی را پشتیبانی نمی‌کند.', true); return; }
    setStatus('در حال یافتن موقعیت شما…');
    navigator.geolocation.getCurrentPosition(function (pos) {
      setPoint(originEl, { lat: pos.coords.latitude, lon: pos.coords.longitude }, 'موقعیت من');
      setStatus('');
    }, function () {
      setStatus('دسترسی به موقعیت داده نشد. اجازه‌ی موقعیت مکانی را برای Safari در تنظیمات آیفون فعال کنید.', true);
    }, { enableHighAccuracy: true, timeout: 15000 });
  });

  var pickTarget = null;
  function endPick() { pickTarget = null; $('#hint').hidden = true; $('#map').classList.remove('picking'); }
  document.querySelectorAll('[data-pick]').forEach(function (b) {
    b.addEventListener('click', function () {
      pickTarget = b.dataset.pick;
      $('#hintText').textContent = pickTarget === 'origin' ? 'روی نقشه بزنید تا مبدا انتخاب شود' : 'روی نقشه بزنید تا مقصد انتخاب شود';
      $('#hint').hidden = false; $('#map').classList.add('picking');
    });
  });
  $('#hintCancel').addEventListener('click', endPick);
  map.on('click', function (e) {
    if (!pickTarget) return;
    var el = pickTarget === 'origin' ? originEl : destEl;
    setPoint(el, { lat: e.latlng.lat, lon: e.latlng.lng }, 'نقطه‌ی انتخابی روی نقشه');
    endPick();
  });

  function resolvePoint(el) {
    var v = el.value.trim();
    if (!v) return Promise.reject(new UserError(el === originEl ? 'مبدا را وارد کنید.' : 'مقصد را وارد کنید.'));
    if (el.dataset.lat) return Promise.resolve({ lat: +el.dataset.lat, lon: +el.dataset.lon, label: v });
    var c = CITY_INDEX[norm(v)];
    if (c) return Promise.resolve({ lat: c.lat, lon: c.lon, label: v });
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ir&accept-language=fa&q=' + encodeURIComponent(v);
    return getJSON(url).then(function (r) {
      if (!r.length) throw new UserError('«' + v + '» پیدا نشد. نام را کامل‌تر بنویسید یا روی نقشه انتخاب کنید.');
      return { lat: +r[0].lat, lon: +r[0].lon, label: v };
    });
  }

  /* ---------- geometry ---------- */
  function hav(a, b) {
    var r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
    var h = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  }
  function samplePoints(coords) {
    var cum = [0], i;
    for (i = 1; i < coords.length; i++) cum[i] = cum[i - 1] + hav(coords[i - 1], coords[i]);
    var total = cum[cum.length - 1];
    var n = Math.max(5, Math.min(24, Math.round(total / 25)));
    var pts = [], j = 1;
    for (var k = 0; k <= n; k++) {
      var target = total * k / n;
      while (j < coords.length - 1 && cum[j] < target) j++;
      var a = coords[j - 1], b = coords[j], seg = cum[j] - cum[j - 1];
      var f = seg > 0 ? Math.min(1, Math.max(0, (target - cum[j - 1]) / seg)) : 0;
      pts.push({ km: target, frac: total > 0 ? target / total : 0, j: j,
        lat: a[1] + (b[1] - a[1]) * f, lon: a[0] + (b[0] - a[0]) * f });
    }
    return { pts: pts, total: total };
  }

  /* ---------- weather ---------- */
  function fetchWeather(pts) {
    var lat = pts.map(function (p) { return p.lat.toFixed(3); }).join(',');
    var lon = pts.map(function (p) { return p.lon.toFixed(3); }).join(',');
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&hourly=temperature_2m,precipitation,snowfall,weather_code,wind_speed_10m,wind_gusts_10m,visibility' +
      '&forecast_days=6&timeformat=unixtime&timezone=auto';
    return getJSON(url, 30000).then(function (d) { return Array.isArray(d) ? d : [d]; });
  }
  function pickHour(h, etaMs) {
    var t = h.time;
    var i = Math.round((etaMs / 1000 - t[0]) / 3600);
    var out = i > t.length - 1;
    i = Math.max(0, Math.min(t.length - 1, i));
    var vis = h.visibility ? h.visibility[i] : null;
    return {
      temp: h.temperature_2m[i], precip: h.precipitation[i] || 0, snow: h.snowfall[i] || 0,
      code: h.weather_code[i], wind: h.wind_speed_10m[i] || 0, gust: h.wind_gusts_10m[i] || 0,
      vis: vis == null ? 99999 : vis, beyond: out
    };
  }
  function assess(w) {
    var s = 0, tags = [], p = w.precip, c = w.code;
    if (p >= 7.5) s = 3; else if (p >= 2.5) s = 2; else if (p >= 0.3) s = 1;
    if ([71, 73, 75, 77, 85, 86].indexOf(c) > -1 || w.snow > 0.1) {
      s = Math.max(s, 2);
      if (c === 75 || c === 86 || w.snow >= 1) s = 3;
    }
    if ([56, 57, 66, 67].indexOf(c) > -1) { s = 3; tags.push('یخ‌زدگی جاده'); }
    else if (w.temp <= 1 && p >= 0.1) { s = Math.max(s, 3); tags.push('خطر یخ‌زدگی جاده'); }
    if (c >= 95) s = 3;
    if (w.vis < 200) { s = 3; tags.push('مه بسیار غلیظ'); }
    else if (w.vis < 1000) { s = Math.max(s, 2); tags.push('مه'); }
    if (w.gust >= 70) { s = 3; tags.push('باد بسیار شدید'); }
    else if (w.gust >= 50) { s = Math.max(s, 2); tags.push('باد شدید'); }
    return { s: s, tags: tags };
  }

  /* ---------- main ---------- */
  var state = { busy: false };
  var markers = [];

  function run() {
    if (state.busy) return;
    state.busy = true; endPick();
    var btn = $('#go'); btn.disabled = true; btn.textContent = 'در حال بررسی…';
    setStatus('پیدا کردن مبدا و مقصد…');
    var o, d, route;
    resolvePoint(originEl).then(function (r) { o = r; return resolvePoint(destEl); })
      .then(function (r) {
        d = r;
        if (hav([o.lon, o.lat], [d.lon, d.lat]) < 1) throw new UserError('مبدا و مقصد تقریباً یکی هستند.');
        setStatus('محاسبه‌ی مسیر…');
        var q = o.lon + ',' + o.lat + ';' + d.lon + ',' + d.lat + '?overview=full&geometries=geojson';
        return getFirst([
          'https://router.project-osrm.org/route/v1/driving/' + q,
          'https://routing.openstreetmap.de/routed-car/route/v1/driving/' + q
        ]).catch(function () {
          throw new UserError('سرویس مسیریابی (OSRM) جواب نداد. اگر VPN دارید روشن کنید و دوباره امتحان کنید.');
        });
      })
      .then(function (rt) {
        if (rt.code !== 'Ok' || !rt.routes || !rt.routes.length) throw new UserError('مسیر ماشین‌رو بین این دو نقطه پیدا نشد. نقطه‌ها را نزدیک جاده انتخاب کنید.');
        route = rt.routes[0];
        var sp = samplePoints(route.geometry.coordinates);
        route.sp = sp;
        setStatus('دریافت وضعیت هوا در ' + fa(sp.pts.length) + ' نقطه‌ی مسیر…');
        return fetchWeather(sp.pts).catch(function () {
          throw new UserError('سرویس هوا (Open-Meteo) جواب نداد. اگر VPN دارید روشن کنید و دوباره امتحان کنید.');
        });
      })
      .then(function (wx) {
        var dep = (departTouched && departEl.value) ? new Date(departEl.value).getTime() : Date.now();
        if (isNaN(dep)) dep = Date.now();
        var pts = route.sp.pts;
        pts.forEach(function (p, i) {
          p.eta = dep + route.duration * p.frac * 1000;
          p.w = pickHour(wx[i], p.eta);
          p.a = assess(p.w);
          var d0 = WX[p.w.code] || ['نامشخص', '❔'];
          p.desc = d0[0]; p.icon = d0[1];
        });
        render({ o: o, d: d, route: route, pts: pts, dep: dep, arr: dep + route.duration * 1000, total: route.sp.total });
        setStatus('');
      })
      .catch(function (e) {
        var msg;
        if (e && e.user) msg = e.message;
        else if (e && e.name === 'AbortError') msg = 'پاسخی از سرور دریافت نشد. اینترنت را بررسی کنید و دوباره امتحان کنید.';
        else msg = 'خطا در دریافت اطلاعات. اتصال اینترنت را بررسی کنید و چند لحظه بعد دوباره امتحان کنید.';
        setStatus(msg, true);
      })
      .then(function () { state.busy = false; btn.disabled = false; btn.textContent = 'بررسی هوای مسیر'; });
  }

  function better(a, b) { return a.a.s > b.a.s || (a.a.s === b.a.s && a.w.precip > b.w.precip); }
  function groupsOf(pts) {
    var g = [], cur = null;
    pts.forEach(function (p, i) {
      if (p.a.s >= 1) {
        if (!cur) { cur = { from: i, to: i, worst: p, wi: i }; g.push(cur); }
        else cur.to = i;
        if (better(p, cur.worst)) { cur.worst = p; cur.wi = i; }
      } else cur = null;
    });
    return g;
  }

  function render(r) {
    var pts = r.pts, worst = 0;
    pts.forEach(function (p) { worst = Math.max(worst, p.a.s); });
    var groups = groupsOf(pts);

    /* map */
    routeLayer.clearLayers(); markers = [];
    var all = r.route.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
    var line = L.polyline(all, { color: '#ffffff', weight: 10, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
    for (var k = 0; k < pts.length - 1; k++) {
      var a = pts[k], b = pts[k + 1];
      var seg = [[a.lat, a.lon]];
      for (var q = a.j; q < b.j; q++) seg.push(all[q]);
      seg.push([b.lat, b.lon]);
      L.polyline(seg, { color: SEV_COLOR[Math.max(a.a.s, b.a.s)], weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
    }
    L.circleMarker([r.o.lat, r.o.lon], { radius: 8, color: '#14232e', weight: 4, fillColor: '#fff', fillOpacity: 1 }).addTo(routeLayer);
    L.circleMarker([r.d.lat, r.d.lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#14232e', fillOpacity: 1 }).addTo(routeLayer);
    pts.forEach(function (p, i) {
      var icon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="mk" data-s="' + p.a.s + '" id="mk' + i + '">' + p.icon + '</div>' });
      var m = L.marker([p.lat, p.lon], { icon: icon, keyboard: false }).addTo(routeLayer);
      m.bindPopup(popupHTML(p, r.dep));
      m.on('click', function () { setActive(i); });
      markers.push(m);
    });

    /* sheet */
    var html = '';
    html += '<div class="meta"><span><b>' + fa(Math.round(r.total)) + '</b> کیلومتر</span><span><b>' + fmtDur(r.route.duration) +
      '</b></span><span>رسیدن حدود <b>' + whenText(r.arr, r.dep) + '</b></span></div>';

    var verdictTitle, verdictSub;
    if (worst === 0) { verdictTitle = 'مسیر بدون بارش و شرایط خطرناک'; verdictSub = 'طبق پیش‌بینی، در طول مسیر مشکل مهمی دیده نمی‌شود.'; }
    else {
      verdictTitle = SEV_LABEL[worst] + ' در مسیر';
      verdictSub = fa(groups.length) + ' بخش از مسیر هوای نامطلوب دارد.';
    }
    html += '<div class="verdict" data-s="' + worst + '"><strong>' + verdictTitle + '</strong><span>' + verdictSub + '</span></div>';

    if (groups.length) {
      html += '<ul class="groups">';
      groups.forEach(function (g) {
        var from = pts[g.from], to = pts[g.to], w = g.worst;
        var range = g.from === g.to ? 'حدود کیلومتر ' + fa(Math.round(from.km)) :
          'کیلومتر ' + fa(Math.round(from.km)) + ' تا ' + fa(Math.round(to.km));
        html += '<li><button type="button" data-i="' + g.wi + '" data-s="' + w.a.s + '"><span class="gi">' + w.icon + '</span><span><b>' +
          w.desc + '</b>' + (w.a.tags.length ? ' · ' + w.a.tags.join('، ') : '') + '<small>' + range + ' · حدود ساعت ' + whenText(w.eta, r.dep) + '</small></span></button></li>';
      });
      html += '</ul>';
    }

    html += '<div class="strip" role="group" aria-label="وضعیت هوا در طول مسیر">';
    for (var s = 0; s < pts.length - 1; s++) {
      var sv = Math.max(pts[s].a.s, pts[s + 1].a.s);
      var idx = pts[s].a.s >= pts[s + 1].a.s ? s : s + 1;
      html += '<button type="button" class="seg" data-s="' + sv + '" data-i="' + idx + '" aria-label="کیلومتر ' + fa(Math.round(pts[s].km)) +
        ' تا ' + fa(Math.round(pts[s + 1].km)) + ': ' + SEV_LABEL[sv] + '"></button>';
    }
    html += '</div><div class="stripends"><span>مبدا · ' + fmtTime(r.dep) + '</span><span>مقصد · ' + fmtTime(r.arr) + '</span></div>';
    html += '<div class="legend">';
    for (var l = 0; l < 4; l++) html += '<span data-s="' + l + '"><i></i>' + SEV_LABEL[l] + '</span>';
    html += '</div>';

    var wazeUrl = 'https://waze.com/ul?ll=' + r.d.lat.toFixed(6) + ',' + r.d.lon.toFixed(6) + '&navigate=yes';
    html += '<div class="actions2"><a href="' + wazeUrl + '" target="_blank" rel="noopener">باز کردن مقصد در Waze</a>' +
      '<button type="button" class="btn" id="refresh">به‌روزرسانی</button></div>' +
      '<p class="note">Waze مسیر را از موقعیت فعلی شما شروع می‌کند.</p>';

    html += '<ol class="pts">';
    pts.forEach(function (p, i) {
      html += '<li><button type="button" class="pt" data-i="' + i + '" data-s="' + p.a.s + '">' +
        '<span class="ico">' + p.icon + '</span>' +
        '<span class="top1"><b>کیلومتر ' + fa(Math.round(p.km)) + '</b><span>' + whenText(p.eta, r.dep) + '</span></span>' +
        '<span class="temp">' + fa(Math.round(p.w.temp)) + '°</span>' +
        '<span class="bot">' + p.desc + p.a.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</span>' +
        '<span class="nums"><span>' + fa(p.w.precip, 1) + ' میلی‌متر</span><span>' + fa(Math.round(p.w.wind)) + ' km/h</span></span>' +
        '</button></li>';
    });
    html += '</ol>';
    html += '<p class="foot">پیش‌بینی است و ممکن است با شرایط واقعی تفاوت داشته باشد؛ برای وضعیت جاده‌ها به اعلام راهداری (۱۴۱) هم توجه کنید. زمان رسیدن تخمینی است و ترافیک و توقف‌ها را شامل نمی‌شود. داده‌ها: Open-Meteo، نقشه: OpenStreetMap، مسیریابی: OSRM.</p>';

    var sheet = $('#sheet');
    sheet.innerHTML = html; sheet.hidden = false; sheet.scrollTop = 0;
    $('#refresh').addEventListener('click', run);

    /* collapse form */
    $('#barText').textContent = r.o.label + ' ← ' + r.d.label;
    $('#top').classList.add('collapsed');

    requestAnimationFrame(function () {
      map.invalidateSize();
      map.fitBounds(line.getBounds(), { padding: [30, 30] });
    });
  }

  function whenText(ms, depMs) {
    var t = fmtTime(ms);
    return dayKey(ms) !== dayKey(depMs) ? fmtDay(ms) + ' ' + t : t;
  }
  function popupHTML(p, dep) {
    return '<div class="pop"><b>کیلومتر ' + fa(Math.round(p.km)) + '</b> · ساعت ' + whenText(p.eta, dep) + '<br>' +
      p.icon + ' ' + p.desc + (p.a.tags.length ? ' · ' + p.a.tags.join('، ') : '') + '<br>' +
      'دما ' + fa(Math.round(p.w.temp)) + '° · بارش ' + fa(p.w.precip, 1) + ' میلی‌متر<br>باد ' + fa(Math.round(p.w.wind)) +
      ' km/h (تندباد ' + fa(Math.round(p.w.gust)) + ')</div>';
  }

  function setActive(i) {
    document.querySelectorAll('.pt.active,.seg.active').forEach(function (e) { e.classList.remove('active'); });
    document.querySelectorAll('.mk.active').forEach(function (e) { e.classList.remove('active'); });
    document.querySelectorAll('.pt[data-i="' + i + '"],.seg[data-i="' + i + '"]').forEach(function (e) { e.classList.add('active'); });
    var mk = document.getElementById('mk' + i); if (mk) mk.classList.add('active');
  }
  function focusPoint(i) {
    var m = markers[i]; if (!m) return;
    setActive(i);
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 9), { animate: true });
    m.openPopup();
  }
  $('#sheet').addEventListener('click', function (e) {
    var el = e.target.closest('[data-i]');
    if (el) focusPoint(+el.dataset.i);
  });

  $('#bar').addEventListener('click', function () { $('#top').classList.remove('collapsed'); });
  $('#form').addEventListener('submit', function (e) { e.preventDefault(); run(); });
})();
</script>
</body>
</html>
